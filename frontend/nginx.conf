server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dynamically resolve Docker internal DNS so backend restarts never leave stale upstream IPs
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests to the internal backend container over nexus_net
    location /api/ {
        set $backend_upstream http://backend:8010;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Serve SPA routes cleanly
    location / {
        try_files $uri $uri/ /index.html;
    }
}
